name: Tests

on:
  push:
  pull_request:

jobs:
  heat-pipe-microreactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: advanced-reactors-neutronics
          environment-file: environment.yml
          auto-activate-base: false
      - name: Install reactor package
        shell: bash -el {0}
        run: python -m pip install -e reactors/heat-pipe-microreactor --no-deps
      - name: Run reactor tests
        shell: bash -el {0}
        run: python -m pytest reactors/heat-pipe-microreactor/tests -q
